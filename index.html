<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BILLY LUCKY DRAW</title>
<style>
:root{--ink:#55465f;--pink:#ffdce9;--lav:#e9e0ff;--blue:#dff3ff;--yellow:#fff1a8;--cream:#fffaf2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 80% 15%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#fff0f5,#f0ebff 48%,#e9f8ff);background-size:70px 70px,100px 100px,auto;overflow-x:hidden}
.wrap{max-width:1100px;margin:auto;padding:26px 18px 42px}
header{text-align:center;margin-bottom:18px}
h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:.06em;margin:8px 0 2px;color:#8b6aa7;text-shadow:2px 3px 0 #fff}
.subtitle{margin:0;color:#8f7c9d;font-weight:700;letter-spacing:.12em;font-size:.85rem}
.panel{background:#ffffffc9;border:2px solid #fff;border-radius:28px;padding:18px;box-shadow:0 14px 40px #9f85b522;backdrop-filter:blur(8px)}
.stage{position:relative;min-height:510px;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#f7f0ff,#fff8f3);border:1px solid #fff}
.starfield{position:absolute;inset:0;pointer-events:none;opacity:.65;background-image:radial-gradient(#fff 1.5px,transparent 2px);background-size:35px 35px}
.stars{position:absolute;inset:18px 14px 120px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:7px;align-items:center;justify-items:center}
.star{position:relative;border:0;background:transparent;padding:0;width:100%;height:100%;min-height:48px;display:grid;place-items:center;transition:transform .35s,filter .35s;cursor:default}
.star-shape{font-size:clamp(30px,5vw,53px);line-height:1;color:#f7cf55;-webkit-text-stroke:1px #e6b94d;filter:drop-shadow(0 4px 2px #b88c4733);animation:float 2.8s ease-in-out infinite;display:inline-block}
.star:nth-child(3n) .star-shape{color:#f8b9d0;-webkit-text-stroke-color:#e99ab8}
.star:nth-child(3n+1) .star-shape{color:#cbb8f4;-webkit-text-stroke-color:#ad97df}
.star:nth-child(4n) .star-shape{color:#a9d9ed;-webkit-text-stroke-color:#87bfd8}
.num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:900;color:#66546c;text-shadow:0 1px 0 #fff;z-index:1}
.star.used{opacity:.18;filter:grayscale(1);transform:scale(.82)}
.star.selected{z-index:5;transform:scale(1.65);filter:drop-shadow(0 0 18px #ffcf5e)}
.star.selected .star-shape{animation:pop .65s ease-in-out infinite alternate}
.billy{position:absolute;bottom:12px;left:8%;width:115px;height:125px;display:flex;flex-direction:column;align-items:center;justify-content:end;z-index:8;transition:left 1.2s cubic-bezier(.2,.8,.2,1),bottom .4s}
.billy.running{animation:bounce .22s infinite alternate}
.avatar{width:72px;height:76px;position:relative;border-radius:45% 45% 42% 42%;background:#f4c9a9;border:3px solid #fff;box-shadow:0 5px 0 #d6b1d2;display:flex;align-items:center;justify-content:center;font-size:25px}
.hair{position:absolute;top:-8px;left:5px;width:57px;height:28px;background:#4b3540;border-radius:55% 55% 25% 25%;transform:rotate(-5deg)}
.face{position:relative;margin-top:15px;letter-spacing:7px;margin-left:7px;font-size:13px;color:#4b3540}
.body{width:67px;height:40px;margin-top:-2px;border-radius:22px 22px 12px 12px;background:#a9d8ec;border:3px solid white;position:relative}
.body:after{content:"";position:absolute;inset:7px 15px;border-radius:8px;background:#fff8}
.name{font-size:11px;font-weight:1000;letter-spacing:.14em;background:#fff;padding:3px 10px;border-radius:20px;margin-top:3px;box-shadow:0 2px 6px #88719a33}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
button.action{border:0;border-radius:999px;padding:13px 24px;font-size:1rem;font-weight:900;letter-spacing:.04em;cursor:pointer;box-shadow:0 5px 0 #b69fc5;transition:transform .15s,box-shadow .15s}
button.action:active{transform:translateY(4px);box-shadow:0 1px 0 #b69fc5}
#draw{background:#f6c6dc;color:#704c66}#reset{background:#e3d8fa;color:#68557e}
button:disabled{opacity:.5;cursor:not-allowed}
.result{min-height:68px;text-align:center;margin:10px auto 0;font-weight:900;font-size:1.2rem;color:#8b6aa7}
.result strong{font-size:2rem;color:#d78bad}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#8b7b95;font-size:.9rem;font-weight:700;margin:10px 4px}
.history{margin-top:15px;background:#fff9;border-radius:18px;padding:14px 16px}
.history h2{font-size:1rem;margin:0 0 8px;color:#8b6aa7}
#historyList{display:flex;gap:7px;flex-wrap:wrap;min-height:26px}
.pill{background:#f1e9fb;border-radius:999px;padding:5px 10px;font-weight:800;font-size:.85rem}
.note{text-align:center;font-size:.8rem;color:#9a8ba2;margin-top:14px}
.sparkle{position:absolute;pointer-events:none;font-size:22px;animation:burst 1s ease-out forwards;z-index:10}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
@keyframes pop{to{transform:rotate(12deg) scale(1.12)}}
@keyframes bounce{to{transform:translateY(-13px) rotate(3deg)}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
@media(max-width:650px){.stage{min-height:530px}.stars{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(8,1fr);inset:12px 8px 135px}.star{min-height:35px}.star-shape{font-size:clamp(28px,8vw,42px)}.billy{width:90px;transform:scale(.88);transform-origin:bottom left}.num{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div style="font-size:25px">✦ ✧ ⭐ ✧ ✦</div>
  <h1>BILLY LUCKY DRAW</h1>
  <p class="subtitle">40 LITTLE STARS • ONE LUCKY PICK</p>
</header>
<main class="panel">
  <div class="meta"><span id="remaining">⭐ Remaining: 40</span><span id="round">DRAW 0 / 40</span></div>
  <section class="stage" id="stage" aria-label="Lucky draw stage">
    <div class="starfield"></div>
    <div class="stars" id="stars"></div>
    <div class="billy" id="billy" aria-label="Billy cartoon mascot">
      <div class="avatar"><div class="hair"></div><span class="face">•ᴗ•</span></div>
      <div class="body"></div><div class="name">BILLY</div>
    </div>
  </section>
  <div class="controls">
    <button class="action" id="draw">⭐ LET'S DRAW!</button>
    <button class="action" id="reset">↻ RESET</button>
  </div>
  <div class="result" id="result" aria-live="polite">Billy is ready to catch a lucky star!</div>
  <section class="history">
    <h2>🌟 LUCKY STARS ALREADY CAUGHT</h2>
    <div id="historyList"><span style="color:#aa9bb1">No stars have been picked yet.</span></div>
  </section>
  <p class="note">Each number can be picked only once. Reset starts a brand-new draw.</p>
</main>
</div>
<script>
const total=40, starsEl=document.getElementById('stars'), billy=document.getElementById('billy');
const drawBtn=document.getElementById('draw'), resetBtn=document.getElementById('reset');
const result=document.getElementById('result'), remaining=document.getElementById('remaining');
const round=document.getElementById('round'), historyList=document.getElementById('historyList');
let picked=[], busy=false, starButtons=[];
function build(){
  starsEl.innerHTML='';starButtons=[];
  for(let n=1;n<=total;n++){
    const b=document.createElement('div');b.className='star';b.dataset.num=n;
    b.innerHTML=`<span class="star-shape">★</span><span class="num">${String(n).padStart(2,'0')}</span>`;
    b.style.animationDelay=(Math.random()*1.5)+'s';
    starsEl.appendChild(b);starButtons.push(b);
  }
  update();
}
function update(){
  starButtons.forEach(el=>{el.classList.toggle('used',picked.includes(+el.dataset.num))});
  remaining.textContent=`⭐ Remaining: ${total-picked.length}`;
  round.textContent=`DRAW ${picked.length} / ${total}`;
  historyList.innerHTML=picked.length?picked.map(n=>`<span class="pill">⭐ ${String(n).padStart(2,'0')}</span>`).join(''):'<span style="color:#aa9bb1">No stars have been picked yet.</span>';
  drawBtn.disabled=busy||picked.length===total;
  if(picked.length===total&&!busy)result.innerHTML='🎉 All 40 lucky stars have been caught!';
}
function sparkle(x,y){
  const symbols=['✦','✧','✨','💫'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='sparkle';s.textContent=symbols[i%symbols.length];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*180-90)+'px');s.style.setProperty('--dy',(Math.random()*-150-20)+'px');document.getElementById('stage').appendChild(s);setTimeout(()=>s.remove(),1100)}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function draw(){
 if(busy||picked.length===total)return;
 busy=true;drawBtn.disabled=true;result.textContent='Billy is running to find a lucky star…';
 const available=starButtons.filter(el=>!picked.includes(+el.dataset.num));
 const chosen=available[Math.floor(Math.random()*available.length)];
 const stageRect=document.getElementById('stage').getBoundingClientRect();
 const starRect=chosen.getBoundingClientRect();
 const targetX=Math.max(0,Math.min(stageRect.width-110,starRect.left-stageRect.left-25));
 billy.classList.add('running');
 billy.style.left=targetX+'px';
 await sleep(1250);
 billy.classList.remove('running');
 result.textContent='Billy found a star… ✨';
 await sleep(900);
 const number=+chosen.dataset.num;picked.push(number);update();chosen.classList.add('selected');
 const x=starRect.left-stageRect.left+starRect.width/2,y=starRect.top-stageRect.top+starRect.height/2;
 sparkle(x,y);
 result.innerHTML=`🎉 The lucky number is <strong>${String(number).padStart(2,'0')}</strong>!`;
 busy=false;update();
}
drawBtn.addEventListener('click',draw);
resetBtn.addEventListener('click',()=>{
 if(busy)return;
 if(!confirm('Reset all results and start a new draw?'))return;
 picked=[];billy.style.left='8%';result.textContent='Billy is ready to catch a lucky star!';build();
});
build();
</script>
</body>
</html>
